<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Early prototypes · ENT record viewer</title>
<meta name="description" content="Three working early prototypes of the ENT record viewer, at increasing fidelity. Same data, three different interfaces.">

<!--
  THREE EARLY PROTOTYPES, ALL REAL, ALL USABLE.

  One file, three layouts, chosen by ?v=1|2|3. They share one data model on
  purpose: the story is that the SAME measurements were arranged three ways
  and only the last arrangement worked. Three separate files would have let
  the numbers drift apart, and then the comparison would prove nothing.

  Fidelity rises deliberately.
    v1  paper      grey boxes, no real data, click-through only
    v2  charts     real charts, capture demoted to a thumbnail
    v3  stacked    everything in one scrolling column

  v1 has no imagery on purpose. A paper prototype with real clinical images
  in it would be a lie about how far along it was.
-->

<style>
:root{
  --bg:#0B0E11; --panel:#12161A; --panel2:#161B20; --line:#252C33;
  --txt:#D6DDE4; --dim:#7C8794; --sig:#E8833A; --blue:#7FD3EE; --ok:#5FCFA0;
  /* the shared motion and focus rules speak in --accent; this file
     called the same colour --blue and therefore had no focus ring at
     all: var(--accent) with no fallback resolves to nothing, and a
     shorthand containing nothing is thrown away in silence. */
  --accent:#7FD3EE;
  --ui:-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}


  /* ── the way out ──────────────────────────────────────────────────────
     A prototype that fills the screen with no chrome is a trap on a phone:
     no visible back, and the page it came from is a tab you have to hunt
     for. This is always visible, always first in the tab order, and it is a
     real link so it works even when there is no history to go back to. */
  .backout{
    position:static;flex:none;z-index:60;
    display:inline-flex;align-items:center;gap:7px;
    min-height:36px;padding:0 13px;
    border:1px solid rgba(255,255,255,.22);border-radius:5px;
    background:rgba(8,11,14,.86);backdrop-filter:blur(8px);
    color:#E4E9EE;text-decoration:none;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.09em;
  }
  .backout:hover{border-color:#E8833A;color:#fff}
  .backout:focus-visible{outline:2px solid #E8833A;outline-offset:2px}
/* ── the banner names the version and what was wrong with it ─────────── */
.note{
  position:fixed;left:0;right:0;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 14px 10px;background:#0A0D10;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;
}
.note b{color:var(--sig);font-weight:400}
.note span{color:var(--dim)}
.prov-inline{color:#8F98A2}
.note .ver{margin-left:auto;display:flex;gap:4px}
.note .ver a{
  padding:3px 9px;border:1px solid var(--line);border-radius:3px;
  color:var(--dim);text-decoration:none;min-height:24px;display:inline-flex;align-items:center;
}
.note .ver a[aria-current]{border-color:var(--sig);color:var(--sig)}
.note .ver a:hover{color:var(--txt)}

/* the banner wraps on a narrow screen, so the work area starts wherever
   the banner actually ends rather than at a guessed offset */
.app{position:absolute;inset:var(--noteh,37px) 0 0;display:grid}

/* ── shared bits ─────────────────────────────────────────────────────── */
.rail{background:var(--panel);border-right:1px solid var(--line);
  padding:14px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.grp{display:grid;gap:7px}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;min-height:34px;font-size:11px;letter-spacing:.1em;color:var(--dim)}
.seg button.on{background:var(--blue);color:#08252F}
input[type=range]{width:100%;accent-color:var(--blue)}
.val{font-family:var(--mono);font-size:15px}
.val i{font-style:normal;font-size:10px;color:var(--dim);margin-left:6px}

.card{background:var(--panel2);border:1px solid var(--line);display:flex;
  flex-direction:column;min-height:0;min-width:0}
.card h2{margin:0;padding:8px 11px;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);font-weight:500}
.card .in{flex:1;min-height:0;display:flex;padding:9px 11px 11px}
.card svg{width:100%;height:100%;display:block}

/* ══ v1 · paper. Deliberately crude: no colour, no data, no polish. ═════ */
body[data-v="1"]{background:#F5F3EF;color:#3A3A3A}
body[data-v="1"] .note{background:#EEEBE5;border-bottom-color:#D6D2CA;color:#6B6B6B}
/* v1 is the paper prototype: a light theme, where every colour chosen
   for the dark versions loses contrast. Measured on its own note
   background, these were 4.18, 3.07, 2.90 and 2.46 to one. */
body[data-v="1"] .note b{color:#9C4818}
body[data-v="1"] .note span{color:#5C5C5C}
body[data-v="1"] .prov-inline{color:#5C5C5C}
body[data-v="1"] .note .ver a{border-color:#D6D2CA;color:#5F5F5F}
body[data-v="1"] .note .ver a[aria-current]{border-color:#9C4818;color:#9C4818}
body[data-v="1"] .app{grid-template-columns:1fr;padding:26px;gap:18px;
  grid-template-rows:auto 1fr auto}
.paper-row{display:grid;gap:18px;grid-template-columns:1fr 1.4fr;min-height:0}
.pbox{border:2px dashed #A9A49B;border-radius:3px;display:grid;place-items:center;
  min-height:120px;color:#8A857C;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-align:center;padding:14px;background:#FBFAF8}
.pbox b{display:block;font-size:12px;color:#5C574F;font-weight:400;margin-bottom:5px}
.pctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  border:2px dashed #A9A49B;border-radius:3px;padding:12px 14px;background:#FBFAF8}
.pctl button{border:1.5px solid #8A857C;border-radius:2px;padding:7px 13px;
  font-family:var(--mono);font-size:11px;color:#5C574F;min-height:34px}
.pctl button.on{background:#3A3A3A;color:#F5F3EF;border-color:#3A3A3A}
.pnum{font-family:var(--mono);font-size:13px;color:#5C574F;min-width:9ch}

/* ══ v2 · charts first. The capture is a thumbnail. That is the mistake. ═ */
body[data-v="2"] .app{grid-template-columns:220px 1fr}
/* the charts take the room and the capture is a thumbnail beside them.
   That IS this version: it is the arrangement the eye tracking later
   showed was wrong, so it has to be drawn the wrong way round. */
.v2grid{display:grid;gap:10px;padding:10px;min-height:0;
  grid-template-columns:minmax(180px,22%) 1fr;grid-template-rows:1fr 1fr}
.v2grid .thumb{max-height:none}

/* ══ v3 · one scrolling column. Everything visible, nothing on screen. ══ */
body[data-v="3"] .app{grid-template-columns:220px 1fr}
.v3col{overflow-y:auto;padding:10px;display:grid;gap:10px;align-content:start}
.v3col .card{min-height:250px}
.v3col .fold{
  position:sticky;bottom:0;margin-top:-1px;padding:6px 0 8px;text-align:center;
  background:linear-gradient(transparent,var(--bg) 60%);
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--sig)}

  /* ══ MOTION ══════════════════════════════════════════════════════════════
     This is a clinical viewer, not a landing page. Every rule below exists
     to answer a question the user would otherwise have to answer by
     re-reading the screen:

       "where did that panel go?"     the promotion is animated from the
                                      old rectangle to the new one, so the
                                      panel is seen to move rather than to
                                      teleport and be re-found
       "did that number change?"      a changed readout flashes once
       "which mode am I in?"          the segment fill grows from the side
                                      it was pressed on

     Nothing here animates the DATA. A trace that eases into place is a trace
     that was, for 200ms, showing a value nobody measured. Charts are redrawn
     instantly; only chrome moves.

     Durations are short on purpose. This is a tool someone uses all day, and
     at the twentieth promotion of the morning a 400ms transition is not
     elegant, it is a wait. 180 to 220ms is the band where a move reads as
     continuous without costing time. */
  :root{
    --ease:cubic-bezier(.22,1,.36,1);
    --t-quick:130ms;
    --t-move:210ms;
  }

  .seg button{
    transition:background var(--t-quick) var(--ease),
               color var(--t-quick) var(--ease);
  }
  .seg button:hover:not(.on){background:var(--panel);color:var(--txt)}

  .play,.zoom,.swap,.backout,.chk{
    transition:border-color var(--t-quick) var(--ease),
               color var(--t-quick) var(--ease),
               background var(--t-quick) var(--ease);
  }

  .pane{
    /* the outline on hover and drop states, not the layout: layout is
       animated in JS, because grid order changes cannot be transitioned */
    transition:outline-color var(--t-quick) var(--ease);
  }
  .pane .ph{cursor:grab}
  .pane .ph:active{cursor:grabbing}

  /* a readout that changed, flashed once. The eye is on the image, not on
     the sidebar, and a value that changes silently is a value that gets
     read wrong on the next glance. */
  @keyframes valflash{
    0%{background:color-mix(in oklab, var(--accent, #4FB3D9) 30%, transparent)}
    100%{background:transparent}
  }
  .val.changed b{animation:valflash 520ms var(--ease)}

  /* every control shows focus. A viewer that can be driven by keyboard but
     never says where the keyboard is cannot be driven by keyboard. */
  .seg button:focus-visible,.play:focus-visible,.zoom:focus-visible,
  .swap:focus-visible,.chk:focus-visible,.backout:focus-visible,
  input[type=range]:focus-visible,.pane .ph:focus-visible{
    outline:2px solid var(--accent, #4FB3D9);outline-offset:2px;
  }

  /* Vestibular safety is not optional in a medical context. Everything
     above is decoration on top of a state change that has already
     happened, so all of it can simply stop. */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }

  /* ══ HIT TARGETS AND KEYBOARD ════════════════════════════════════════════
     Measured, not guessed. A tab pass through this viewer found a range
     input whose focusable box was 212 x 3 px and checkboxes at 13 x 13.
     Both are well under the 24 px minimum, and both are controls a
     clinician uses one-handed while looking at the image rather than at
     the sidebar.

     The visible track stays 3 px. Only the box you can hit grows. */
  input[type=range]{
    height:24px;
    background:transparent;      /* the track is drawn below, not here */
    margin:0;
    padding:0;
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:3px;background:var(--line);border-radius:2px;
  }
  input[type=range]::-moz-range-track{
    height:3px;background:var(--line);border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent, #4FB3D9);cursor:pointer;border:2px solid var(--panel);
    margin-top:-6px;            /* centre the thumb on a 3px track */
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;
    background:var(--accent, #4FB3D9);cursor:pointer;border:2px solid var(--panel);
  }

  /* the label is the real target for a checkbox, so it is the label that
     has to be big enough to hit */
  .chk{min-height:28px;align-items:center}
  .chk input{width:16px;height:16px;flex:0 0 auto}

  /* ── keyboard reordering ────────────────────────────────────────────────
     Panes could be rearranged by dragging a header and no other way, so a
     keyboard user could not do it at all. The header is now a real control:
     focus it and press the arrow keys to move the pane. Shown on focus,
     because a hint that is always visible is noise in a tool you use every
     day. */
  .pane .ph{outline-offset:-2px}
  .pane .ph:focus-visible{outline:2px solid var(--accent, #4FB3D9)}
  .ph-hint{
    display:none;margin-left:auto;padding-left:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:9.5px;letter-spacing:.08em;color:var(--accent, #4FB3D9);
    white-space:nowrap;
  }
  .pane .ph:focus-visible .ph-hint{display:inline}

  /* ══ STRUCTURE AND FOCUS ═════════════════════════════════════════════════
     Three things the stress suite found the moment these files were added
     to it, all of which had been true since the day they were written:

       the document started at <h3>, so a screen reader announcing the
       outline found four third-level headings under nothing at all

       several controls had no focus ring, because the earlier rules named
       classes and these controls have none

       the banner would not wrap, so at 375px it was 509px wide and pushed
       the page sideways
  */

  /* named for what it is: present for a screen reader, absent on screen.
     clip-path rather than display:none, which would remove it outright. */
  .sr-only{
    position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;
  }

  /* every focusable thing, not a list of class names that will go stale */
  a:focus-visible,button:focus-visible,input:focus-visible,
  select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--accent, #4FB3D9);
    outline-offset:2px;
  }

  /* the banner is fixed and full width, and its text has to be allowed to
     wrap rather than force the viewport wider than the phone */
  .note{flex-wrap:wrap}
  .note>*{min-width:0}
  .note span{white-space:normal;overflow-wrap:break-word}

  /* ══ NARROW ══════════════════════════════════════════════════════════════
     The early prototypes were laid out at a fixed 220px rail plus whatever
     was left, with no media query anywhere, so on a phone the cards forced
     the page 509px wide and the whole thing scrolled sideways.

     Below 56rem the rail goes on top and the cards stack. These are low
     fidelity by design, so there is nothing here that needs side-by-side
     comparison — which is exactly why they were the easy ones to fix. */
  @media (max-width: 56rem){
    .app{
      position:static;
      grid-template-columns:minmax(0,1fr) !important;
      grid-auto-rows:auto;
      padding-top:var(--noteh,37px);
    }
    .rail{
      border-right:0;border-bottom:1px solid var(--line);
      overflow:visible;
    }
    .card{min-height:200px}
    .card svg{height:auto;aspect-ratio:16/10}
    .note{position:static}
  }

  /* the mark travels with the sentence that qualifies it, never alone: a
     ZEISS logo on its own above someone else's rebuild reads as a byline */
  /* the banner is one horizontal row, so the mark needs a divider and real
     space after it or it reads as the first word of the sentence */
  .clientmark{width:18px;height:18px;border-radius:2px;flex:none;
    margin-right:2px;padding-right:10px;border-right:1px solid var(--line);
    box-sizing:content-box}

  /* the back arrow is drawn rather than typed, so the row has to align it:
     a text arrow takes its shape from whatever font loaded and sits on the
     baseline instead of on the optical centre of the words beside it */
  .backout{display:inline-flex;align-items:center;gap:7px}
  .backout .ar{flex:none;transition:transform 130ms cubic-bezier(.22,1,.36,1)}
  .backout:hover .ar{transform:rotate(180deg) translateX(-2px)}
</style>
<!-- The outline starts here. On screen the viewer names itself
     in the rail; a screen reader needs a real level-one heading,
     and a visible one would spend space this layout has not got. -->
<h1 class="sr-only">ENT Record Viewer — early prototypes</h1>


<div class="note" id="note"></div>
<div class="app" id="app"></div>

<script>
/* ══ one data model, shared by every version ═══════════════════════════ */
/* ── the way back ────────────────────────────────────────────────────────
   history.back() when the reader actually came from somewhere, so their
   scroll position on the case study survives. A hard link otherwise. */
(function(){
  var a = document.getElementById('backout');
  if (!a) return;
  var sameOrigin = false;
  try { sameOrigin = !!document.referrer &&
        new URL(document.referrer).origin === location.origin; } catch (e) {}
  /* The prototypes are served from two places: /v2/... in the static build
     and / in the React build. Work out where "back" actually is rather than
     hard-coding a path that is wrong in one of them. */
  a.setAttribute('href',
    location.pathname.indexOf('/v2/') !== -1 ? '../v4/case-ent.html' : '/case/zeiss');
  if (sameOrigin && history.length > 1) {
    a.addEventListener('click', function(e){ e.preventDefault(); history.back(); });
  }
  /* Escape is the other thing people reach for when a page has swallowed
     the screen. Not while a control has focus: Esc means "cancel this". */
  addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (document.fullscreenElement) return;          /* Esc exits fullscreen first */
    var t = document.activeElement;
    if (t && t !== document.body && t.tagName !== 'A') return;
    a.click();
  });
})();

const NS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

const N = 320, F_MIN = 250, F_MAX = 8000;
const freqAt = i => Math.round(F_MIN * Math.pow(F_MAX / F_MIN, i / (N - 1)));
/* healthy drum resonates near 1 kHz; fluid mass-loads it and the peak
   collapses and shifts down. Same model as the final prototype. */
const respAt = i => {
  const f = freqAt(i);
  if (state.eff) { const x = Math.log(f / 700); return 0.20 * Math.exp(-(x * x) / 1.15); }
  const x = Math.log(f / 1050); return Math.exp(-(x * x) / 0.62);
};
const AUD_F = [250, 500, 1000, 2000, 4000, 8000];
const BONE = [5, 5, 10, 5, 10, 15];
const AIR_OK = [10, 5, 10, 10, 15, 20];
const AIR_GAP = [40, 40, 35, 30, 30, 35];

const state = { idx: 159, ear: 'L', eff: false };

/* ══ drawings, version-independent ════════════════════════════════════ */
function mobility(svg) {
  svg.setAttribute('viewBox', '0 0 460 240'); svg.innerHTML = '';
  const L = 44, R = 12, T = 14, B = 30, W = 460, H = 240, w = W - L - R, h = H - T - B;
  for (let i = 0; i <= 4; i++) {
    const y = T + h * i / 4;
    svg.appendChild(el('line', { x1: L, y1: y, x2: W - R, y2: y, stroke: '#262B33' }));
  }
  [250, 1000, 4000, 8000].forEach(f => {
    const i = Math.round((N - 1) * Math.log(f / F_MIN) / Math.log(F_MAX / F_MIN));
    const x = L + w * i / (N - 1);
    const t = el('text', { x, y: H - 10, 'text-anchor': 'middle', 'font-size': 9,
      fill: '#7A848E', 'font-family': 'ui-monospace,monospace' });
    t.textContent = f >= 1000 ? (f / 1000) + 'k' : f; svg.appendChild(t);
  });
  let d = '';
  for (let i = 0; i < N; i += 2)
    d += (d ? ' L ' : 'M ') + (L + w * i / (N - 1)).toFixed(1) + ' ' + (T + h * (1 - respAt(i))).toFixed(1);
  svg.appendChild(el('path', { d: d + ` L ${L + w} ${T + h} L ${L} ${T + h} Z`,
    fill: '#4FB3D9', 'fill-opacity': .10 }));
  svg.appendChild(el('path', { d, fill: 'none', stroke: '#4FB3D9', 'stroke-width': 1.8 }));
  const mx = L + w * state.idx / (N - 1);
  svg.appendChild(el('line', { x1: mx, y1: T, x2: mx, y2: T + h,
    stroke: '#E8833A', 'stroke-dasharray': '3 3' }));
}

function audiogram(svg) {
  svg.setAttribute('viewBox', '0 0 460 240'); svg.innerHTML = '';
  const L = 44, R = 12, T = 14, B = 30, W = 460, H = 240, w = W - L - R, h = H - T - B;
  const air = state.eff ? AIR_GAP : AIR_OK;
  const X = i => L + i * (w / (AUD_F.length - 1));
  const Y = db => T + (db + 10) / 120 * h;
  svg.appendChild(el('rect', { x: L, y: Y(-10), width: w, height: Y(25) - Y(-10),
    fill: '#3FBF8F', 'fill-opacity': .07 }));
  for (let db = -10; db <= 110; db += 20)
    svg.appendChild(el('line', { x1: L, y1: Y(db), x2: W - R, y2: Y(db), stroke: '#232930' }));
  AUD_F.forEach((f, i) => {
    const t = el('text', { x: X(i), y: H - 10, 'text-anchor': 'middle', 'font-size': 9,
      fill: '#7A848E', 'font-family': 'ui-monospace,monospace' });
    t.textContent = f >= 1000 ? (f / 1000) + 'k' : f; svg.appendChild(t);
  });
  if (state.eff) AUD_F.forEach((f, i) => svg.appendChild(el('line',
    { x1: X(i), y1: Y(BONE[i]), x2: X(i), y2: Y(air[i]),
      stroke: '#E8833A', 'stroke-width': 6, 'stroke-opacity': .22, 'stroke-linecap': 'round' })));
  const line = (v, c, dash) => svg.appendChild(el('path',
    { d: v.map((d, i) => (i ? 'L' : 'M') + X(i) + ' ' + Y(d)).join(' '),
      fill: 'none', stroke: c, 'stroke-width': 1.8, 'stroke-dasharray': dash || 'none' }));
  line(BONE, '#8A939C', '4 3');
  line(air, state.eff ? '#E8833A' : '#5FCFA0');
  AUD_F.forEach((f, i) => svg.appendChild(el('path',
    { d: `M ${X(i) - 4} ${Y(air[i]) - 4} l 8 8 M ${X(i) + 4} ${Y(air[i]) - 4} l -8 8`,
      stroke: state.eff ? '#E8833A' : '#5FCFA0', 'stroke-width': 1.8, 'stroke-linecap': 'round' })));
}

/* a stand-in for the capture. These early versions never had real imagery
   wired in, and drawing one here would overstate how far along they were. */
function capture(svg) {
  svg.setAttribute('viewBox', '0 0 460 240'); svg.innerHTML = '';
  svg.appendChild(el('rect', { x: 0, y: 0, width: 460, height: 240, fill: '#05080B' }));
  const y = 150 - respAt(state.idx) * 40;
  svg.appendChild(el('path', { d: `M 30 ${y + 22} Q 230 ${y - 26} 430 ${y + 22}`,
    fill: 'none', stroke: '#C9D2DA', 'stroke-width': 4, 'stroke-linecap': 'round' }));
  svg.appendChild(el('rect', { x: 214, y: y + 2, width: 22, height: 34, rx: 4, fill: '#C9A227' }));
  const t = el('text', { x: 20, y: 26, 'font-size': 10, fill: '#7F8892',
    'font-family': 'ui-monospace,monospace', 'letter-spacing': 1.4 });
  t.textContent = 'SLICE ' + (state.idx + 1) + ' / 320 · PLACEHOLDER'; svg.appendChild(t);
}

function otoscopy(svg) {
  svg.setAttribute('viewBox', '0 0 460 240'); svg.innerHTML = '';
  svg.appendChild(el('rect', { x: 0, y: 0, width: 460, height: 240, fill: '#05080B' }));
  svg.appendChild(el('circle', { cx: 230, cy: 120, r: 86, fill: '#2A2320', stroke: '#3A3230' }));
  svg.appendChild(el('circle', { cx: 230, cy: 120, r: 72,
    fill: state.eff ? '#5C5348' : '#7C6F68' }));
  svg.appendChild(el('path', { d: 'M 230 120 L 268 172', stroke: '#D8CFC6', 'stroke-width': 7,
    'stroke-linecap': 'round', 'stroke-opacity': state.eff ? .25 : .8 }));
}

/* ══ the three layouts ════════════════════════════════════════════════ */
const card = (title, draw) => {
  const c = document.createElement('div'); c.className = 'card';
  /* h2, not h3: the only h1 is the viewer's name, so a pane is the
     second level. The static sweep could not see this one because the
     panes are built at runtime. */
  const h = document.createElement('h2'); h.textContent = title;
  const b = document.createElement('div'); b.className = 'in';
  const svg = el('svg'); b.appendChild(svg); c.append(h, b);
  c._draw = () => draw(svg);
  return c;
};

function rail() {
  const r = document.createElement('div'); r.className = 'rail';
  r.innerHTML = `
    <div class="grp"><div class="lbl">Ear</div>
      <div class="seg" id="segEar">
        <button data-ear="L" class="on">LEFT</button><button data-ear="R">RIGHT</button></div></div>
    <div class="grp"><div class="lbl">Middle ear</div>
      <div class="seg" id="segEff">
        <button data-eff="0" class="on">AIR</button><button data-eff="1">EFFUSION</button></div></div>
    <div class="grp"><div class="lbl">Slice</div>
      <div class="val"><b id="fV">1.00 kHz</b><i id="sV">slice 160 / 320</i></div>
      <input type="range" id="sl" min="0" max="319" value="159"></div>`;
  return r;
}

function layout(v) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const cards = [];

  if (v === '1') {
    const row = document.createElement('div'); row.className = 'paper-row';
    row.innerHTML = `
      <div class="pbox"><span><b>CAPTURE</b>the scan goes here</span></div>
      <div class="pbox"><span><b>NUMBERS</b>mobility + hearing test</span></div>`;
    const grid = document.createElement('div'); grid.className = 'paper-row';
    grid.innerHTML = `
      <div class="pbox"><span><b>OTOSCOPY</b>photo of the drum</span></div>
      <div class="pbox"><span><b>NOTES</b>free text</span></div>`;
    const ctl = document.createElement('div'); ctl.className = 'pctl';
    ctl.innerHTML = `
      <button id="p-l" class="on">LEFT</button><button id="p-r">RIGHT</button>
      <button id="p-prev">&larr; SLICE</button><button id="p-next">SLICE &rarr;</button>
      <span class="pnum" id="p-num">160 / 320</span>`;
    app.append(row, grid, ctl);
    const num = ctl.querySelector('#p-num');
    const step = d => { state.idx = Math.min(N - 1, Math.max(0, state.idx + d));
      num.textContent = (state.idx + 1) + ' / 320'; };
    ctl.querySelector('#p-prev').onclick = () => step(-8);
    ctl.querySelector('#p-next').onclick = () => step(8);
    ctl.querySelector('#p-l').onclick = e => { e.target.classList.add('on');
      ctl.querySelector('#p-r').classList.remove('on'); };
    ctl.querySelector('#p-r').onclick = e => { e.target.classList.add('on');
      ctl.querySelector('#p-l').classList.remove('on'); };
    return [];
  }

  app.append(rail());

  if (v === '2') {
    const g = document.createElement('div'); g.className = 'v2grid';
    const thumb = card('Capture', capture); thumb.classList.add('thumb');
    const oto = card('Otoscopy', otoscopy); oto.classList.add('thumb');
    const mob = card('Mobility', mobility);
    const aud = card('Audiogram', audiogram);
    /* column one: the two pictures, small. column two: the numbers, large. */
    g.append(thumb, mob, oto, aud);
    app.append(g);
    cards.push(thumb, mob, aud, oto);
  } else {
    const col = document.createElement('div'); col.className = 'v3col';
    const c1 = card('Capture', capture), c2 = card('Mobility', mobility),
          c3 = card('Audiogram', audiogram), c4 = card('Otoscopy', otoscopy);
    const fold = document.createElement('div'); fold.className = 'fold';
    fold.textContent = '↓ MORE BELOW THE FOLD';
    col.append(c1, c2, c3, c4, fold);
    app.append(col);
    cards.push(c1, c2, c3, c4);
  }
  return cards;
}

/* ══ boot ═════════════════════════════════════════════════════════════ */
const VERSIONS = {
  '1': { name: 'v1 · paper', wrong: 'No data, no hierarchy. Nobody could say which box mattered.' },
  '2': { name: 'v2 · charts first', wrong: 'The charts got the space and the scan got a thumbnail. It tested fine.' },
  '3': { name: 'v3 · one column', wrong: 'Nothing hidden, but the fourth view is always below the fold.' },
};
const v = (new URLSearchParams(location.search).get('v') || '1');
const cfg = VERSIONS[v] || VERSIONS['1'];
document.body.dataset.v = v;

document.getElementById('note').innerHTML =
  `<a class="backout" id="backout" href="/case/zeiss"><svg class="ar" width="15" height="10" viewBox="0 0 18 12" fill="none" aria-hidden="true" style="transform:rotate(180deg)"><path d="M1.2 6h14.6M11.5 1.6 16.2 6l-4.7 4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg> Back</a>
   <img class="clientmark" src="assets/zeiss-logo.svg" alt="ZEISS" onerror="this.remove()">
   <b>ENT &times; ZEISS &middot; ${cfg.name}</b><span>${cfg.wrong}</span>
   <span class="prov-inline">my design, rebuilt from my own data &middot; original under NDA</span>
   <span class="ver">
     ${Object.keys(VERSIONS).map(k => `<a href="?v=${k}"${k === v ? ' aria-current="page"' : ''}>v${k}</a>`).join('')}
     <a href="ent-prototype-tabbed.html">v4</a>
     <a href="ent-prototype.html">final</a>
   </span>`;

/* measure the banner and hand its height to the layout, so nothing is ever
   hidden underneath it on a narrow screen */
const measureNote = () => document.documentElement.style.setProperty(
  '--noteh', document.getElementById('note').offsetHeight + 'px');
measureNote();
addEventListener('resize', measureNote, { passive: true });

const cards = layout(v);
const draw = () => cards.forEach(c => c._draw());

const rl = document.querySelector('.rail');
if (rl) {
  const sl = rl.querySelector('#sl'), fV = rl.querySelector('#fV'), sV = rl.querySelector('#sV');
  const sync = () => {
    const f = freqAt(state.idx);
    fV.textContent = f >= 1000 ? (f / 1000).toFixed(2) + ' kHz' : f + ' Hz';
    sV.textContent = `slice ${state.idx + 1} / ${N}`;
  };
  sl.addEventListener('input', e => { state.idx = +e.target.value; sync(); draw(); });
  rl.querySelector('#segEar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    rl.querySelectorAll('#segEar button').forEach(x => x.classList.toggle('on', x === b));
    state.ear = b.dataset.ear; draw();
  });
  rl.querySelector('#segEff').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    rl.querySelectorAll('#segEff button').forEach(x => x.classList.toggle('on', x === b));
    state.eff = b.dataset.eff === '1'; draw();
  });
  sync();
}
draw();
addEventListener('resize', draw, { passive: true });
</script>
</html>
