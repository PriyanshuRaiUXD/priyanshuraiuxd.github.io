    <!-- Content Security Policy.

         This page injects authored SVG through dangerouslySetInnerHTML and
         embeds a third-party prototype frame. Both are safe because of what
         we put in them today; a CSP is what keeps them safe when someone
         later changes what goes in.

         style-src needs 'unsafe-inline' because the scenes write transform
         and opacity to element.style every frame. script-src does not, and
         that is the one that matters. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      frame-src 'self' https://embed.figma.com https://www.figma.com;
      connect-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <!-- frame-ancestors is deliberately absent: it is ignored in a meta tag
         and only warns. It belongs in a real response header, which is a
         host setting rather than a build artefact. See DEPLOY.md. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- the two faces above the fold, fetched before first paint so the
         page does not flash a fallback and reflow -->
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font"
          type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font"
